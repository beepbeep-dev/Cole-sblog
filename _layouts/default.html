<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}Cole</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: 'Posts by Cole.' | strip_html | strip_newlines | truncate: 160 | escape }}">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Crect x='9' y='8' width='14' height='16' rx='3' fill='%23C8FF4D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <nav class="nav" aria-label="Main">
    <div class="wrap">
      <a class="logo" href="/">cole<span class="caret" aria-hidden="true"></span></a>
      <ul>
        <li><a class="link" href="/">About</a></li>
        <li><a class="link" href="/numbers.html">Numbers</a></li>
        <li><a class="link" href="/news.html">News</a></li>
        <li><a class="link" href="/posts.html"{% if page.layout == 'post' or page.url == '/posts.html' %} aria-current="page"{% endif %}>Posts</a></li>
        <li><a class="link" href="/media.html"{% if page.url == '/media.html' %} aria-current="page"{% endif %}>Media</a></li>
      </ul>
    </div>
  </nav>

  <main id="main">
{{ content }}
  </main>

  <footer>
    <div class="wrap">
      <span>&copy; <span data-year>2026</span> Cole</span>
      <a href="/posts.html">All posts &rarr;</a>
    </div>
  </footer>

  <script src="/assets/site.js"></script>
  <script src="/assets/game.js"></script>
</body>
</html>
